name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # MSchemaManager declares final properties, which need PHP 8.4.
        php: ['8.4']
        # 11.8 is the first release with VEC_DISTANCE(), so it is the floor. Every
        # release after it renders the stored vector index options differently - 11.8
        # and 13 quote the values, 12 leaves them bare - and the option parser has to
        # keep reading all of those spellings back.
        mariadb: ['11.8', '12.0', '13.0']

    # The job runs inside a PHP container so that the MariaDB service is addressable by
    # its own name both on GitHub and under `act`. A non-container job would see the
    # service on 127.0.0.1 on GitHub but on the container network under act.
    container:
      image: php:${{ matrix.php }}-cli

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_vector_search
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: mariadb
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_vector_search
      SS_ENVIRONMENT_TYPE: dev
      # Test classes are found through the class manifest, which is cached between runs.
      SS_PHPUNIT_FLUSH: 1
      COMPOSER_NO_INTERACTION: 1

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libicu-dev libzip-dev

      - name: Install PHP extensions
        run: docker-php-ext-install -j"$(nproc)" intl mysqli zip

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer \
            | php -- --install-dir=/usr/local/bin --filename=composer

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # act does not apply the service health check, so wait for the server explicitly.
      - name: Wait for MariaDB
        run: |
          for _ in $(seq 1 60); do
            if php -r 'exit(@mysqli_connect(
              getenv("SS_DATABASE_SERVER"),
              getenv("SS_DATABASE_USERNAME"),
              getenv("SS_DATABASE_PASSWORD")
            ) ? 0 : 1);'; then
              php -r '$db = mysqli_connect(
                getenv("SS_DATABASE_SERVER"),
                getenv("SS_DATABASE_USERNAME"),
                getenv("SS_DATABASE_PASSWORD")
              ); echo "MariaDB ", $db->server_info, " is up", PHP_EOL;'
              exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become available" >&2
          exit 1

      - name: PHPUnit
        run: vendor/bin/phpunit

  lint:
    name: Lint
    runs-on: ubuntu-latest

    container:
      image: php:8.4-cli

    env:
      COMPOSER_NO_INTERACTION: 1

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libicu-dev libzip-dev

      - name: Install PHP extensions
        run: docker-php-ext-install -j"$(nproc)" intl zip

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer \
            | php -- --install-dir=/usr/local/bin --filename=composer

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHP CodeSniffer
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
