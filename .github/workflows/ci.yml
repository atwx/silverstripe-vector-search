name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # PHP 8.4 is the floor in practice: MSchemaManager declares final properties,
        # which 8.3 rejects outright, even though composer.json allows ^8.3 through
        # silverstripe/framework.
        php: ['8.4']
        # Only 11.8 passes today. 11.7 has VECTOR columns but no VEC_DISTANCE(), and
        # both 11.7 and 12.0 render the vector index options unquoted in SHOW CREATE
        # TABLE (`"M"=6` rather than 11.8's `"M"='6'`), which MSchemaManager's parser
        # does not match - on those versions db:build rebuilds the HNSW graph every run.
        # Add them back once vectorIndexOptions() accepts unquoted values.
        mariadb: ['11.8']

    # The job runs inside a PHP container so that the MariaDB service is addressable by
    # its own name both on GitHub and under `act`. With a non-container job GitHub maps
    # the service to 127.0.0.1 while act leaves it on the container network, and no single
    # host name would work in both.
    container:
      image: php:${{ matrix.php }}-cli

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_vector_search
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: mariadb
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_vector_search
      SS_ENVIRONMENT_TYPE: dev
      # Test classes are found through the class manifest, which is cached between runs.
      SS_PHPUNIT_FLUSH: 1
      COMPOSER_NO_INTERACTION: 1

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libicu-dev libzip-dev

      - name: Install PHP extensions
        run: docker-php-ext-install -j"$(nproc)" intl mysqli zip

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer \
            | php -- --install-dir=/usr/local/bin --filename=composer

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # act does not apply the service health check, so wait for the server explicitly
      # rather than racing it.
      - name: Wait for MariaDB
        run: |
          for _ in $(seq 1 60); do
            if php -r 'exit(@mysqli_connect(
              getenv("SS_DATABASE_SERVER"),
              getenv("SS_DATABASE_USERNAME"),
              getenv("SS_DATABASE_PASSWORD")
            ) ? 0 : 1);'; then
              php -r '$db = mysqli_connect(
                getenv("SS_DATABASE_SERVER"),
                getenv("SS_DATABASE_USERNAME"),
                getenv("SS_DATABASE_PASSWORD")
              ); echo "MariaDB ", $db->server_info, " is up", PHP_EOL;'
              exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become available" >&2
          exit 1

      - name: PHPUnit
        run: vendor/bin/phpunit
